<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="#4c0505" stroke="url(#goldRing)" stroke-width="3" />
  <circle cx="50" cy="50" r="44" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

  <!-- Inner Seal Circle -->
  <clipPath id="innerClip">
    <circle cx="50" cy="50" r="41" />
  </clipPath>
  <g clip-path="url(#innerClip)">
    <!-- Sky -->
    <rect x="0" y="0" width="100" height="100" fill="url(#skyGrad)" />
    <!-- Sun Rays & Sun -->
    <circle cx="50" cy="38" r="16" fill="url(#sunGrad)" opacity="0.95" />
    <polygon points="50,15 48,26 52,26" fill="#eab308" />
    <polygon points="34,21 38,29 41,27" fill="#eab308" />
    <polygon points="66,21 59,27 62,29" fill="#eab308" />
    <polygon points="25,36 34,36 34,39" fill="#eab308" />
    <polygon points="75,36 66,39 66,36" fill="#eab308" />

    <!-- Mountains -->
    <polygon points="5,68 35,42 62,68" fill="url(#mountainGrad)" />
    <polygon points="38,68 68,46 95,68" fill="#14532d" />

    <!-- River / Water (Mandulog River) -->
    <path d="M 0,65 Q 25,60 50,68 T 100,66 L 100,100 L 0,100 Z" fill="url(#waterGrad)" />
    <!-- Water ripple lines -->
    <path d="M 10,76 Q 30,72 55,77 T 90,75" stroke="#7dd3fc" stroke-width="1.5" fill="none" />
    <path d="M 20,86 Q 45,82 70,87" stroke="#bae6fd" stroke-width="1.2" fill="none" />

    <!-- Shield / Laurel Badge in Center -->
    <path d="M 50,62 L 58,74 L 50,86 L 42,74 Z" fill="#b91c1c" stroke="#fef08a" stroke-width="1" />
    <circle cx="50" cy="74" r="3" fill="#fef08a" />
  </g>

  <!-- Laurel Wreath Trim at bottom -->
  <path d="M 22,65 Q 50,92 78,65" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="2,3" />
</svg>
